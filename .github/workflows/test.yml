name: Test

# Deliberately no `paths:` filter. build.yml's filter is why a lockfile-only
# dependency bump currently produces no image and runs nothing; a correctness
# gate must not be able to be skipped by touching the wrong file.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run tests
        run: cargo test --workspace --locked
